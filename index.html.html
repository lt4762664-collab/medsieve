<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Tra Cứu Triệu Chứng Y Tế Lâm Sàng</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #f0f7f7; color: #2d3748; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #007791; }
        h2 { color: #005a70; text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #718096; margin-bottom: 25px; font-size: 14px; }
        .search-box { text-align: center; display: flex; gap: 8px; justify-content: center; }
        input { width: 75%; padding: 12px 15px; font-size: 16px; border: 2px solid #b2d8d8; border-radius: 6px; outline: none; }
        input:focus { border-color: #007791; }
        button { padding: 12px 20px; font-size: 16px; cursor: pointer; background-color: #007791; color: white; border: none; border-radius: 6px; font-weight: bold; }
        button:hover { background-color: #005a70; }
        #result { margin-top: 25px; padding: 15px; border-left: 5px solid #007791; display: none; background: #edf2f7; border-radius: 6px; }
        .disease-item { background: white; padding: 15px; border: 1px solid #cbd5e0; border-radius: 6px; margin-bottom: 12px; }
        .disease-name { color: #c53030; font-size: 17px; font-weight: bold; margin: 0 0 5px 0; }
        .hospital-btn { display: inline-block; margin-top: 15px; padding: 12px 20px; background-color: #e53e3e; color: white; text-decoration: none; font-weight: bold; border-radius: 6px; text-align: center; width: 93%; transition: background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .hospital-btn:hover { background-color: #c53030; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Hệ thống tra cứu triệu chứng Y tế</h2>
        <div class="subtitle">Nhập các triệu chứng cách nhau bằng dấu phẩy (Ví dụ: sốt, ho, đau đầu...)</div>
        
        <div class="search-box">
            <input type="text" id="symptomInput" placeholder="Nhập các biểu hiện sức khỏe tại đây...">
            <button onclick="searchDisease()">Tìm kiếm </button>
        </div>

        <div id="result"></div>
    </div>

    <script>
        // Kho dữ liệu 20 bệnh lý lâm sàng cốt lõi
        const dataBinh = [
            // Hệ Hô hấp
            { name: "Cúm mùa", symptoms: ["sốt", "ho", "đau họng", "sổ mũi", "mệt mỏi"] },
            { name: "Viêm phế quản cấp", symptoms: ["ho kéo dài", "có đờm", "khó thở", "đau ngực nhẹ"] },
            { name: "Viêm xoang", symptoms: ["đau đầu", "ngạt mũi", "chảy mũi đặc", "đau vùng mặt"] },
            { name: "Viêm họng hạt", symptoms: ["đau họng", "nuốt vướng", "ho khan", "ngứa họng"] },
{ name: "Hen suyễn", symptoms: ["khó thở", "thở khò khè", "tức ngực", "ho về đêm"] },
            // Hệ Tiêu hóa
            { name: "Viêm dạ dày", symptoms: ["đau bụng", "ợ chua", "buồn nôn", "đầy bụng", "đau thượng vị"] },
            { name: "Ngộ độc thực phẩm", symptoms: ["đau bụng", "tiêu chảy", "buồn nôn", "nôn mửa", "sốt nhẹ"] },
            { name: "Trào ngược dạ dày", symptoms: ["ợ nóng", "ợ chua", "đau ngực", "khó nuốt", "đắng miệng"] },
            { name: "Viêm đại tràng", symptoms: ["đau bụng dưới", "mót rặn", "tiêu chảy", "đầy hơi"] },
            // Truyền nhiễm & Nhiệt đới
            { name: "Sốt xuất huyết", symptoms: ["sốt cao", "đau cơ", "phát ban", "nhức đầu", "đau hốc mắt"] },
            { name: "Thủy đậu", symptoms: ["sốt nhẹ", "mệt mỏi", "nổi mụn nước", "ngứa da"] },
            { name: "Sốt siêu vi", symptoms: ["sốt cao liên tục", "đau đầu", "đau nhức người", "mệt mỏi"] },
            // Da liễu & Dị ứng
            { name: "Dị ứng thời tiết", symptoms: ["ngứa da", "mẩn đỏ", "hắt hơi", "sổ mũi"] },
            { name: "Mề đay cấp tính", symptoms: ["sưng nề da", "ngứa dữ dội", "nổi sẩn cục"] },
            { name: "Zona thần kinh", symptoms: ["đau rát da", "nổi mụn nước chùm", "đau nhức thần kinh"] },
            // Thần kinh & Cơ xương khớp
            { name: "Suy nhược cơ thể", symptoms: ["mệt mỏi", "chóng mặt", "mất ngủ", "chán ăn"] },
            { name: "Rối loạn tiền đình", symptoms: ["chóng mặt", "hoa mắt", "mất thăng bằng", "buồn nôn"] },
            { name: "Thiếu máu não", symptoms: ["đau đầu", "hoa mắt", "chóng mặt", "tê bì chân tay"] },
            // Cơ quan khác
            { name: "Đau mắt đỏ", symptoms: ["mắt đỏ", "ngứa mắt", "chảy nước mắt", "ghèn mắt"] },
            { name: "Nhiệt miệng", symptoms: ["đau rát miệng", "vết loét trắng", "sưng lợi"] }
        ];

        function searchDisease() {
            const inputRaw = document.getElementById("symptomInput").value.toLowerCase().trim();
            const resultDiv = document.getElementById("result");
            
            if (inputRaw === "") {
                alert("Vui lòng nhập triệu chứng để hệ thống tiến hành phân tích!");
                return;
            }

            const userSymptoms = inputRaw.split(/[,，\s]+/).filter(s => s.length > 0);
            let results = [];

            dataBinh.forEach(disease => {
                let matchCount = 0;
                userSymptoms.forEach(uSymptom => {
                    let found = disease.symptoms.find(dSymptom => dSymptom.includes(uSymptom) || uSymptom.includes(dSymptom));
if (found) matchCount++;
                });

                if (matchCount > 0) {
                    results.push({ name: disease.name, allSymptoms: disease.symptoms, matchCount: matchCount });
                }
            });

            results.sort((a, b) => b.matchCount - a.matchCount);

            resultDiv.style.display = "block";
            if (results.length > 0) {
                let html = "<h3 style='color:#005a70; margin-top:0;'>📊 Kết quả phân tích biểu hiện lâm sàng:</h3>";
                
                results.forEach(r => {
                    html += `
                        <div class="disease-item">
                            <p class="disease-name">🩺 Chuẩn đoán sơ bộ: ${r.name}</p>
                            <span style='font-size:12px; color:#2f855a; font-weight:bold;'>Độ tương thích: Khớp ${r.matchCount} triệu chứng nhập vào</span>
                            <p style='margin: 8px 0 0 0; font-size:14px; color:#4a5568;'><strong>Tổ hợp biểu hiện:</strong> ${r.allSymptoms.join(", ")}</p>
                        </div>
                    `;
                });
                
                // ĐÃ CẬP NHẬT: Đường link mở thẳng bản đồ Google Maps và tự động quét vị trí chỉ đường
                html += `
                    <a href="https://www.google.com/maps/@21.574111,105.8642597,15z?entry=ttu&g_ep=EgoyMDI2MDkwOS4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="hospital-btn">
                        🗺️ TÌM BỆNH VIỆN/PHÒNG KHÁM GẦN NHẤT
                    </a>
                    <p style='color:#e53e3e; font-size:12px; font-weight:bold; margin-top:15px; border-top: 1px solid #cbd5e0; padding-top:10px;'>
                        * Lưu ý quan trọng: Kết quả chỉ mang tính chất sàng lọc mô phỏng định hướng. Người bệnh nên nhấn nút mở bản đồ phía trên để tìm kiếm đến cơ sở y tế thăm khám chính xác.
                    </p>
                `;
                resultDiv.innerHTML = html;
            } else {
                html += `
                    <p>Không tìm thấy cấu trúc bệnh lý phù hợp. Vui lòng tinh chỉnh từ khóa triệu chứng hoặc mở bản đồ bên dưới để tìm cơ sở y tế.</p>
                    <a href="google.com" target="_blank" class="hospital-btn">🗺️ TÌM BỆNH VIỆN GẦN NHẤT</a>
                `;
                resultDiv.innerHTML = html;
            }
        }
    </script>
</body>
</html>
